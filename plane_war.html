<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>飞机大战</title>
<style>
  :root {
    --bg: #060814;
    --panel: #0d1428;
    --accent: #4fc3f7;
    --accent2: #ff6b6b;
    --gold: #ffd166;
    --text: #e8f0ff;
    --muted: #7a8bb0;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; background:#000;
    display:flex; align-items:center; justify-content:center;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    overflow: hidden;
    touch-action: none;
  }
  #game-wrap {
    position: relative;
    width: 480px;
    height: 720px;
    max-width: 100vw;
    max-height: 100vh;
    background: var(--bg);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(79,195,247,0.15);
  }
  canvas { display:block; background: transparent; touch-action:none; }

  #hud {
    position:absolute; top:0; left:0; width:100%;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:10px 12px; pointer-events:none;
    font-size:13px; z-index:5;
  }
  .hud-box {
    background: rgba(10,15,35,0.55);
    border: 1px solid rgba(79,195,247,0.25);
    border-radius: 8px;
    padding: 6px 10px;
    backdrop-filter: blur(2px);
  }
  #hp-bar-outer {
    width:120px; height:10px; background:rgba(255,255,255,0.12);
    border-radius:6px; overflow:hidden; margin-top:4px;
  }
  #hp-bar-inner {
    height:100%; width:100%; background: linear-gradient(90deg,#4fc3f7,#7cf7c4);
    transition: width 0.15s linear;
  }
  #weapon-dots { margin-top:5px; display:flex; gap:4px; }
  .wdot { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.15); }
  .wdot.on { background: var(--gold); box-shadow:0 0 6px var(--gold); }

  #top-right { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  #controls-btns { display:flex; gap:6px; pointer-events:auto; }
  .icon-btn {
    width:30px; height:30px; border-radius:7px;
    background: rgba(10,15,35,0.6); border:1px solid rgba(79,195,247,0.3);
    color:var(--text); font-size:14px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none;
  }
  .icon-btn:active { background: rgba(79,195,247,0.3); }

  #boss-hp-wrap {
    position:absolute; top:44px; left:50%; transform:translateX(-50%);
    width:70%; z-index:5; display:none;
  }
  #boss-hp-label { font-size:11px; color:var(--accent2); text-align:center; margin-bottom:2px; letter-spacing:2px;}
  #boss-hp-outer { width:100%; height:8px; background:rgba(255,255,255,0.12); border-radius:5px; overflow:hidden; }
  #boss-hp-inner { height:100%; width:100%; background: linear-gradient(90deg,#ff6b6b,#ffd166); transition: width 0.15s linear; }

  .overlay {
    position:absolute; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at center, rgba(10,15,35,0.92), rgba(0,0,0,0.97));
    text-align:center; padding:24px;
  }
  .overlay h1 { font-size:30px; letter-spacing:4px; color:var(--accent); margin-bottom:6px; text-shadow:0 0 20px rgba(79,195,247,0.5); }
  .overlay h2 { font-size:22px; color:var(--accent2); margin-bottom:10px; letter-spacing:2px; }
  .overlay p { color: var(--muted); font-size:13px; line-height:1.7; max-width:340px; margin:4px 0; }
  .score-line { font-size:16px; margin:10px 0; color:var(--text); }
  .score-line b { color: var(--gold); }
  .btn {
    margin-top:18px; padding:11px 34px; border:none; border-radius:24px;
    background: linear-gradient(135deg, var(--accent), #2196f3);
    color:#04101f; font-size:15px; font-weight:700; letter-spacing:2px;
    cursor:pointer; box-shadow:0 4px 18px rgba(79,195,247,0.4);
  }
  .btn:active { transform: scale(0.96); }
  .btn.secondary {
    background: rgba(255,255,255,0.08); color: var(--text);
    box-shadow:none; border:1px solid rgba(255,255,255,0.2);
    margin-top:10px; padding:8px 26px; font-size:13px;
  }
  .hidden { display:none !important; }
  .kbd { display:inline-block; background:rgba(255,255,255,0.1); border-radius:4px; padding:1px 7px; margin:0 2px; font-size:12px; }

  #touch-hint {
    position:absolute; bottom:14px; left:0; width:100%; text-align:center;
    font-size:11px; color:var(--muted); z-index:5; pointer-events:none;
  }
</style>
</head>
<body>

<div id="game-wrap">
  <canvas id="game" width="480" height="720"></canvas>

  <div id="hud">
    <div class="hud-box">
      <div>分数 <b id="score-val" style="color:var(--gold)">0</b></div>
      <div style="color:var(--muted); font-size:11px;">最高 <span id="high-val">0</span></div>
      <div id="hp-bar-outer"><div id="hp-bar-inner"></div></div>
      <div id="weapon-dots">
        <div class="wdot" data-i="1"></div>
        <div class="wdot" data-i="2"></div>
        <div class="wdot" data-i="3"></div>
        <div class="wdot" data-i="4"></div>
      </div>
    </div>
    <div id="top-right">
      <div class="hud-box" style="text-align:right;">
        第 <b id="wave-val" style="color:var(--accent)">1</b> 波
      </div>
      <div id="controls-btns">
        <div class="icon-btn" id="btn-mute">🔊</div>
        <div class="icon-btn" id="btn-pause">⏸</div>
      </div>
    </div>
  </div>

  <div id="boss-hp-wrap">
    <div id="boss-hp-label">BOSS</div>
    <div id="boss-hp-outer"><div id="boss-hp-inner"></div></div>
  </div>

  <div id="touch-hint">拖动屏幕移动飞机 · 自动开火</div>

  <!-- 开始界面 -->
  <div class="overlay" id="screen-start">
    <h1>✈ 飞机大战</h1>
    <p>键盘 <span class="kbd">WASD</span> / <span class="kbd">方向键</span> 移动，或直接拖动/触屏控制。飞机自动开火。</p>
    <p>击败敌机掉落道具：<b style="color:var(--gold)">武器强化</b> / <b style="color:#7cf7c4">护盾</b> / <b style="color:#ff8a8a">回血</b>。每 5 波出现 BOSS。</p>
    <button class="btn" id="btn-start">开始游戏</button>
  </div>

  <!-- 暂停界面 -->
  <div class="overlay hidden" id="screen-pause">
    <h2>已暂停</h2>
    <button class="btn" id="btn-resume">继续</button>
    <button class="btn secondary" id="btn-restart-from-pause">重新开始</button>
  </div>

  <!-- 结束界面 -->
  <div class="overlay hidden" id="screen-over">
    <h2>游戏结束</h2>
    <div class="score-line">本次得分 <b id="final-score">0</b></div>
    <div class="score-line" style="font-size:13px; color:var(--muted);">最高纪录 <span id="final-high">0</span></div>
    <button class="btn" id="btn-restart">再来一局</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ============ 基础设置 ============
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const rand = (a,b) => Math.random()*(b-a)+a;
  const randInt = (a,b) => Math.floor(rand(a,b+1));
  const clamp = (v,a,b) => Math.max(a, Math.min(b,v));
  const aabb = (a,b) => a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;

  // ============ 音效 (WebAudio, 无外部文件) ============
  let audioCtx = null;
  let muted = false;
  function ensureAudio(){
    if(!audioCtx){
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ audioCtx = null; }
    }
  }
  function beep(freq, dur, type='square', vol=0.06, slideTo=null){
    if(muted || !audioCtx) return;
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if(slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0+dur);
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0+dur);
  }
  function playShoot(){ beep(880, 0.05, 'square', 0.035, 660); }
  function playHit(){ beep(220, 0.08, 'sawtooth', 0.05, 110); }
  function playExplosion(){
    if(muted || !audioCtx) return;
    const t0 = audioCtx.currentTime;
    const bufferSize = audioCtx.sampleRate * 0.25;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1) * (1 - i/bufferSize);
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.15, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.25);
    noise.connect(gain); gain.connect(audioCtx.destination);
    noise.start(t0);
  }
  function playPowerup(){ beep(520, 0.09, 'triangle', 0.05, 1040); }
  function playGameOver(){ beep(300, 0.5, 'sawtooth', 0.06, 60); }

  // ============ 游戏状态 ============
  let gameState = 'start'; // start | playing | paused | over
  let score = 0;
  let highScore = Number(localStorage.getItem('planeWarHighScore') || 0);
  let wave = 1;
  let waveTimer = 0;
  const WAVE_DURATION = 18000;
  let enemySpawnTimer = 0;
  let bossActive = false;
  let boss = null;
  let bossSpawnedForWave = 0;
  let stars = [];
  let lastTime = 0;

  document.getElementById('high-val').textContent = highScore;

  // ============ 输入 ============
  const keys = new Set();
  let pointerActive = false;
  let pointerX = W/2, pointerY = H-100;

  window.addEventListener('keydown', e => {
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    keys.add(e.code);
    if(e.code === 'KeyP') togglePause();
  });
  window.addEventListener('keyup', e => keys.delete(e.code));

  function getPointerPos(e){
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX);
    const cy = (e.touches ? e.touches[0].clientY : e.clientY);
    return {
      x: (cx - rect.left) * (W/rect.width),
      y: (cy - rect.top) * (H/rect.height)
    };
  }
  function onPointerDown(e){
    ensureAudio();
    pointerActive = true;
    const p = getPointerPos(e);
    pointerX = p.x; pointerY = p.y;
    e.preventDefault();
  }
  function onPointerMove(e){
    if(!pointerActive) return;
    const p = getPointerPos(e);
    pointerX = p.x; pointerY = p.y;
    e.preventDefault();
  }
  function onPointerUp(e){ pointerActive = false; }

  canvas.addEventListener('mousedown', onPointerDown);
  canvas.addEventListener('mousemove', onPointerMove);
  window.addEventListener('mouseup', onPointerUp);
  canvas.addEventListener('touchstart', onPointerDown, {passive:false});
  canvas.addEventListener('touchmove', onPointerMove, {passive:false});
  canvas.addEventListener('touchend', onPointerUp);

  // ============ 星空背景 ============
  function initStars(){
    stars = [];
    for(let i=0;i<70;i++){
      stars.push({ x: rand(0,W), y: rand(0,H), r: rand(0.5,2), speed: rand(20,90) });
    }
  }
  function updateStars(dt){
    for(const s of stars){
      s.y += s.speed * dt/1000;
      if(s.y > H){ s.y = -2; s.x = rand(0,W); }
    }
  }
  function drawStars(){
    ctx.fillStyle = '#cfe8ff';
    for(const s of stars){
      ctx.globalAlpha = 0.35 + (s.r/2)*0.5;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ============ 玩家 ============
  const player = {
    x: W/2, y: H-110, w: 34, h: 40,
    speed: 340, // px/sec
    hp: 100, maxHp: 100,
    weaponLevel: 1,
    fireCooldown: 0,
    shieldTime: 0,
    hitFlash: 0,
    alive: true,
  };
  const FIRE_RATES = [0,260,220,180,140]; // 索引对应武器等级 1~4

  function resetPlayer(){
    player.x = W/2; player.y = H-110;
    player.hp = player.maxHp = 100;
    player.weaponLevel = 1;
    player.fireCooldown = 0;
    player.shieldTime = 0;
    player.hitFlash = 0;
    player.alive = true;
  }

  function updatePlayer(dt){
    if(!player.alive) return;
    if(pointerActive){
      const dx = pointerX - player.x, dy = pointerY - player.y;
      player.x += dx * clamp(dt/1000*12, 0, 1);
      player.y += dy * clamp(dt/1000*12, 0, 1);
    } else {
      let dx=0, dy=0;
      if(keys.has('ArrowLeft')||keys.has('KeyA')) dx -= 1;
      if(keys.has('ArrowRight')||keys.has('KeyD')) dx += 1;
      if(keys.has('ArrowUp')||keys.has('KeyW')) dy -= 1;
      if(keys.has('ArrowDown')||keys.has('KeyS')) dy += 1;
      const len = Math.hypot(dx,dy) || 1;
      player.x += (dx/len) * player.speed * dt/1000;
      player.y += (dy/len) * player.speed * dt/1000;
    }
    player.x = clamp(player.x, player.w/2+4, W-player.w/2-4);
    player.y = clamp(player.y, player.h/2+4, H-player.h/2-4);

    if(player.shieldTime > 0) player.shieldTime -= dt;
    if(player.hitFlash > 0) player.hitFlash -= dt;

    // 自动开火
    player.fireCooldown -= dt;
    if(player.fireCooldown <= 0){
      fireForPlayer();
      player.fireCooldown = FIRE_RATES[player.weaponLevel];
    }
  }

  function fireForPlayer(){
    const lvl = player.weaponLevel;
    const px = player.x, py = player.y - player.h/2;
    playShoot();
    if(lvl === 1){
      bullets.push(new Bullet(px, py, 0, -520, 1, '#4fc3f7'));
    } else if(lvl === 2){
      bullets.push(new Bullet(px-8, py+6, 0, -520, 1, '#4fc3f7'));
      bullets.push(new Bullet(px+8, py+6, 0, -520, 1, '#4fc3f7'));
    } else if(lvl === 3){
      bullets.push(new Bullet(px, py, 0, -540, 1, '#7cf7c4'));
      bullets.push(new Bullet(px-10, py+8, -60, -520, 1, '#7cf7c4'));
      bullets.push(new Bullet(px+10, py+8, 60, -520, 1, '#7cf7c4'));
    } else {
      bullets.push(new Bullet(px-9, py, 0, -560, 1.4, '#ffd166'));
      bullets.push(new Bullet(px+9, py, 0, -560, 1.4, '#ffd166'));
      bullets.push(new Bullet(px-16, py+10, -90, -520, 1, '#ffd166'));
      bullets.push(new Bullet(px+16, py+10, 90, -520, 1, '#ffd166'));
    }
  }

  function damagePlayer(amount){
    if(player.shieldTime > 0 || !player.alive) return;
    player.hp -= amount;
    player.hitFlash = 180;
    playHit();
    if(player.hp <= 0){
      player.hp = 0;
      player.alive = false;
      spawnBurst(player.x, player.y, '#4fc3f7', 26);
      playExplosion();
      setTimeout(()=> triggerGameOver(), 400);
    }
  }

  function drawPlayer(){
    if(!player.alive) return;
    ctx.save();
    ctx.translate(player.x, player.y);
    if(player.hitFlash > 0 && Math.floor(player.hitFlash/60)%2===0){
      ctx.globalAlpha = 0.4;
    }
    // 引擎火焰
    ctx.beginPath();
    ctx.moveTo(-6, player.h/2-4);
    ctx.lineTo(0, player.h/2+10+Math.random()*4);
    ctx.lineTo(6, player.h/2-4);
    ctx.fillStyle = 'rgba(255,180,80,0.8)';
    ctx.fill();
    // 机身
    ctx.beginPath();
    ctx.moveTo(0, -player.h/2);
    ctx.lineTo(player.w/2, player.h/2);
    ctx.lineTo(0, player.h/2-8);
    ctx.lineTo(-player.w/2, player.h/2);
    ctx.closePath();
    const grad = ctx.createLinearGradient(0,-player.h/2,0,player.h/2);
    grad.addColorStop(0, '#8be9ff');
    grad.addColorStop(1, '#2196f3');
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = '#e8f7ff'; ctx.lineWidth = 1.5; ctx.stroke();

    if(player.shieldTime > 0){
      ctx.globalAlpha = 0.5 + Math.sin(Date.now()/80)*0.15;
      ctx.beginPath();
      ctx.arc(0,0, player.w/2+12, 0, Math.PI*2);
      ctx.strokeStyle = '#7cf7c4';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // ============ 子弹 ============
  class Bullet {
    constructor(x,y,vx,vy,dmg,color,w=4,h=11){
      this.x=x; this.y=y; this.vx=vx; this.vy=vy;
      this.dmg=dmg; this.color=color; this.w=w; this.h=h;
    }
    update(dt){ this.x += this.vx*dt/1000; this.y += this.vy*dt/1000; }
    get bounds(){ return {x:this.x-this.w/2, y:this.y-this.h/2, w:this.w, h:this.h}; }
    draw(){
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(Math.atan2(this.vy, this.vx)+Math.PI/2);
      ctx.fillStyle = this.color;
      ctx.shadowColor = this.color; ctx.shadowBlur = 6;
      ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
      ctx.restore();
      ctx.shadowBlur = 0;
    }
  }
  let bullets = [];       // 玩家子弹
  let enemyBullets = [];  // 敌方子弹

  // ============ 粒子 ============
  class Particle {
    constructor(x,y,color){
      this.x=x; this.y=y;
      const a = rand(0,Math.PI*2), sp = rand(40,220);
      this.vx = Math.cos(a)*sp; this.vy = Math.sin(a)*sp;
      this.life = rand(300,650); this.maxLife=this.life;
      this.color = color; this.r = rand(1.5,3.5);
    }
    update(dt){
      this.x += this.vx*dt/1000; this.y += this.vy*dt/1000;
      this.vx *= 0.96; this.vy *= 0.96;
      this.life -= dt;
    }
    draw(){
      ctx.globalAlpha = Math.max(this.life/this.maxLife, 0);
      ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  let particles = [];
  function spawnBurst(x,y,color,count=14){
    for(let i=0;i<count;i++) particles.push(new Particle(x,y,color));
  }

  // ============ 道具 ============
  class PowerUp {
    constructor(x,y,type){
      this.x=x; this.y=y; this.type=type; this.w=22; this.h=22;
      this.vy = 90;
      this.angle = 0;
    }
    update(dt){ this.y += this.vy*dt/1000; this.angle += dt*0.003; }
    get bounds(){ return {x:this.x-this.w/2, y:this.y-this.h/2, w:this.w, h:this.h}; }
    draw(){
      ctx.save();
      ctx.translate(this.x,this.y);
      ctx.rotate(Math.sin(this.angle)*0.25);
      let color, label;
      if(this.type==='weapon'){ color='#ffd166'; label='W'; }
      else if(this.type==='shield'){ color='#7cf7c4'; label='S'; }
      else { color='#ff8a8a'; label='+'; }
      ctx.beginPath();
      ctx.arc(0,0,this.w/2,0,Math.PI*2);
      ctx.fillStyle = color; ctx.globalAlpha=0.25; ctx.fill();
      ctx.globalAlpha=1;
      ctx.strokeStyle = color; ctx.lineWidth=2; ctx.stroke();
      ctx.fillStyle = color;
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(label, 0, 1);
      ctx.restore();
    }
  }
  let powerUps = [];

  function applyPowerUp(type){
    playPowerup();
    if(type === 'weapon'){
      player.weaponLevel = Math.min(4, player.weaponLevel+1);
    } else if(type === 'shield'){
      player.shieldTime = 5000;
    } else if(type === 'heal'){
      player.hp = Math.min(player.maxHp, player.hp+30);
    }
  }

  // ============ 敌机 ============
  class Enemy {
    constructor(type, x, wave){
      this.type = type;
      this.x = x; this.y = -40;
      this.t = 0;
      this.fireTimer = rand(600,1600);
      const diff = 1 + wave*0.045;
      if(type === 'grunt'){
        this.w=28; this.h=28; this.hp=this.maxHp=1; this.speed=90*diff; this.score=10; this.color='#ff6b6b';
      } else if(type === 'zigzag'){
        this.w=30; this.h=30; this.hp=this.maxHp=2; this.speed=110*diff; this.score=20; this.color='#c77dff';
        this.baseX = x; this.amp = rand(50,110); this.freq = rand(1.4,2.4);
      } else { // tank
        this.w=46; this.h=44; this.hp=this.maxHp=8+Math.floor(wave/3); this.speed=48*diff; this.score=50; this.color='#ffa94d';
      }
    }
    update(dt){
      this.t += dt;
      if(this.type === 'zigzag'){
        this.x = this.baseX + Math.sin(this.t/1000*this.freq)*this.amp;
        this.y += this.speed*dt/1000;
      } else {
        this.y += this.speed*dt/1000;
      }
      this.fireTimer -= dt;
      if(this.fireTimer <= 0 && this.y > 0 && this.y < H-140){
        this.shoot();
        this.fireTimer = this.type==='tank' ? rand(1400,2200) : rand(1200,2600);
      }
    }
    shoot(){
      const dx = player.x - this.x, dy = player.y - this.y;
      const dist = Math.hypot(dx,dy) || 1;
      const spd = 220;
      if(this.type === 'tank'){
        for(let i=-1;i<=1;i++){
          const ang = Math.atan2(dy,dx) + i*0.28;
          enemyBullets.push(new Bullet(this.x, this.y+this.h/2, Math.cos(ang)*spd, Math.sin(ang)*spd, 12, '#ffa94d', 6, 6));
        }
      } else {
        enemyBullets.push(new Bullet(this.x, this.y+this.h/2, dx/dist*spd, dy/dist*spd, this.type==='zigzag'?10:8, this.color, 5,5));
      }
    }
    get bounds(){ return {x:this.x-this.w/2, y:this.y-this.h/2, w:this.w, h:this.h}; }
    draw(){
      ctx.save();
      ctx.translate(this.x,this.y);
      ctx.rotate(Math.PI);
      ctx.beginPath();
      ctx.moveTo(0,-this.h/2);
      ctx.lineTo(this.w/2, this.h/2);
      ctx.lineTo(0, this.h/2-6);
      ctx.lineTo(-this.w/2, this.h/2);
      ctx.closePath();
      ctx.fillStyle = this.color;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth=1; ctx.stroke();
      ctx.restore();
      if(this.maxHp > 1){
        const bw = this.w;
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(this.x-bw/2, this.y-this.h/2-8, bw, 4);
        ctx.fillStyle = '#7cf7c4';
        ctx.fillRect(this.x-bw/2, this.y-this.h/2-8, bw*(this.hp/this.maxHp), 4);
      }
    }
  }
  let enemies = [];

  // ============ BOSS ============
  class Boss {
    constructor(wave){
      this.x = W/2; this.y = -80;
      this.w = 110; this.h = 90;
      this.hp = this.maxHp = 150 + wave*45;
      this.speed = 70;
      this.entering = true;
      this.t = 0;
      this.attackTimer = 1500;
      this.dir = 1;
    }
    update(dt){
      this.t += dt;
      if(this.entering){
        this.y += 60*dt/1000;
        if(this.y >= 90) { this.y = 90; this.entering = false; }
        return;
      }
      this.x += this.dir * this.speed * dt/1000;
      if(this.x < this.w/2+10 || this.x > W-this.w/2-10) this.dir *= -1;

      this.attackTimer -= dt;
      if(this.attackTimer <= 0){
        this.attackPattern();
        this.attackTimer = rand(1300,1900);
      }
    }
    attackPattern(){
      const pattern = randInt(0,2);
      if(pattern === 0){
        // 环形弹幕
        const n = 16;
        for(let i=0;i<n;i++){
          const ang = (Math.PI*2/n)*i;
          enemyBullets.push(new Bullet(this.x, this.y+this.h/2, Math.cos(ang)*160, Math.sin(ang)*160, 14, '#ff6b6b', 6,6));
        }
      } else if(pattern === 1){
        // 瞄准扇形
        const dx = player.x-this.x, dy = player.y-this.y;
        const baseAng = Math.atan2(dy,dx);
        for(let i=-3;i<=3;i++){
          const ang = baseAng + i*0.15;
          enemyBullets.push(new Bullet(this.x, this.y+this.h/2, Math.cos(ang)*260, Math.sin(ang)*260, 14, '#ffd166', 6,7));
        }
      } else {
        // 双侧直线连发提示(单次两组)
        enemyBullets.push(new Bullet(this.x-40, this.y+this.h/2, -40, 260, 12, '#c77dff',6,8));
        enemyBullets.push(new Bullet(this.x+40, this.y+this.h/2, 40, 260, 12, '#c77dff',6,8));
        enemyBullets.push(new Bullet(this.x, this.y+this.h/2, 0, 300, 16, '#c77dff',7,9));
      }
    }
    get bounds(){ return {x:this.x-this.w/2, y:this.y-this.h/2, w:this.w, h:this.h}; }
    draw(){
      ctx.save();
      ctx.translate(this.x,this.y);
      ctx.beginPath();
      ctx.moveTo(0,-this.h/2);
      ctx.lineTo(this.w/2, 0);
      ctx.lineTo(this.w/2-14, this.h/2);
      ctx.lineTo(-(this.w/2-14), this.h/2);
      ctx.lineTo(-this.w/2, 0);
      ctx.closePath();
      const g = ctx.createLinearGradient(0,-this.h/2,0,this.h/2);
      g.addColorStop(0,'#ff9a9a'); g.addColorStop(1,'#b83b3b');
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
      ctx.beginPath();
      ctx.arc(0,4,12,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.fill();
      ctx.restore();
    }
  }

  // ============ 波次 / 生成逻辑 ============
  function spawnEnemyWave(dt){
    if(bossActive) return;
    enemySpawnTimer -= dt;
    if(enemySpawnTimer <= 0){
      const interval = Math.max(340, 1150 - wave*35);
      enemySpawnTimer = interval;
      const roll = Math.random();
      let type = 'grunt';
      if(wave >= 3 && roll < 0.22) type = 'tank';
      else if(wave >= 2 && roll < 0.55) type = 'zigzag';
      const x = rand(30, W-30);
      enemies.push(new Enemy(type, x, wave));
    }
  }

  function maybeSpawnBoss(){
    if(wave % 5 === 0 && bossSpawnedForWave !== wave && !bossActive){
      bossActive = true;
      bossSpawnedForWave = wave;
      boss = new Boss(wave);
      document.getElementById('boss-hp-wrap').style.display = 'block';
    }
  }

  // ============ 碰撞 & 更新 ============
  function updateBulletsAndCollisions(dt){
    // 玩家子弹
    for(let i=bullets.length-1;i>=0;i--){
      const b = bullets[i];
      b.update(dt);
      if(b.y < -20 || b.x < -20 || b.x > W+20){ bullets.splice(i,1); continue; }

      let hit = false;
      for(let j=enemies.length-1;j>=0;j--){
        const en = enemies[j];
        if(aabb(b.bounds, en.bounds)){
          en.hp -= b.dmg;
          spawnBurst(b.x,b.y,en.color,4);
          hit = true;
          if(en.hp <= 0){
            score += en.score;
            spawnBurst(en.x,en.y,en.color,20);
            playExplosion();
            maybeDropPowerUp(en.x, en.y);
            enemies.splice(j,1);
          }
          break;
        }
      }
      if(!hit && bossActive && boss && aabb(b.bounds, boss.bounds)){
        boss.hp -= b.dmg;
        spawnBurst(b.x,b.y,'#ff9a9a',4);
        hit = true;
        if(boss.hp <= 0){
          score += 500;
          spawnBurst(boss.x,boss.y,'#ff6b6b',44);
          playExplosion();
          for(let k=0;k<3;k++) maybeDropPowerUp(boss.x+rand(-30,30), boss.y+rand(-10,10), true);
          bossActive = false; boss = null;
          document.getElementById('boss-hp-wrap').style.display = 'none';
        }
      }
      if(hit) bullets.splice(i,1);
    }

    // 敌方子弹
    for(let i=enemyBullets.length-1;i>=0;i--){
      const b = enemyBullets[i];
      b.update(dt);
      if(b.y > H+20 || b.y < -20 || b.x < -20 || b.x > W+20){ enemyBullets.splice(i,1); continue; }
      if(player.alive && aabb(b.bounds, {x:player.x-player.w/2,y:player.y-player.h/2,w:player.w,h:player.h})){
        damagePlayer(b.dmg);
        enemyBullets.splice(i,1);
      }
    }

    // 敌机 vs 玩家 (撞击)
    for(let j=enemies.length-1;j>=0;j--){
      const en = enemies[j];
      en.update(dt);
      if(en.y > H+50){ enemies.splice(j,1); continue; }
      if(player.alive && aabb(en.bounds, {x:player.x-player.w/2,y:player.y-player.h/2,w:player.w,h:player.h})){
        damagePlayer(18);
        spawnBurst(en.x,en.y,en.color,14);
        enemies.splice(j,1);
      }
    }

    // Boss vs 玩家
    if(bossActive && boss){
      boss.update(dt);
      if(player.alive && aabb(boss.bounds, {x:player.x-player.w/2,y:player.y-player.h/2,w:player.w,h:player.h})){
        damagePlayer(0.6); // 持续接触伤害
      }
    }

    // 道具
    for(let i=powerUps.length-1;i>=0;i--){
      const p = powerUps[i];
      p.update(dt);
      if(p.y > H+30){ powerUps.splice(i,1); continue; }
      if(player.alive && aabb(p.bounds, {x:player.x-player.w/2,y:player.y-player.h/2,w:player.w,h:player.h})){
        applyPowerUp(p.type);
        powerUps.splice(i,1);
      }
    }

    // 粒子
    for(let i=particles.length-1;i>=0;i--){
      particles[i].update(dt);
      if(particles[i].life <= 0) particles.splice(i,1);
    }
  }

  function maybeDropPowerUp(x,y,force=false){
    const roll = Math.random();
    if(!force && roll > 0.22) return;
    let type = 'weapon';
    const r2 = Math.random();
    if(r2 < 0.4) type = 'weapon';
    else if(r2 < 0.72) type = 'shield';
    else type = 'heal';
    powerUps.push(new PowerUp(x,y,type));
  }

  // ============ UI 更新 ============
  function updateHUD(){
    document.getElementById('score-val').textContent = score;
    document.getElementById('wave-val').textContent = wave;
    document.getElementById('hp-bar-inner').style.width = clamp(player.hp/player.maxHp*100,0,100)+'%';
    document.querySelectorAll('.wdot').forEach(d=>{
      d.classList.toggle('on', Number(d.dataset.i) <= player.weaponLevel);
    });
    if(bossActive && boss){
      document.getElementById('boss-hp-inner').style.width = clamp(boss.hp/boss.maxHp*100,0,100)+'%';
    }
  }

  // ============ 主循环 ============
  function update(dt){
    updateStars(dt);
    updatePlayer(dt);
    updateBulletsAndCollisions(dt);

    if(!bossActive){
      spawnEnemyWave(dt);
      waveTimer += dt;
      if(waveTimer >= WAVE_DURATION){
        waveTimer = 0;
        wave += 1;
      }
      maybeSpawnBoss();
    }
    updateHUD();
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    // 背景渐变
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#050813'); g.addColorStop(1,'#0a1330');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    drawStars();

    for(const p of powerUps) p.draw();
    for(const en of enemies) en.draw();
    if(bossActive && boss) boss.draw();
    for(const b of enemyBullets) b.draw();
    for(const b of bullets) b.draw();
    for(const pt of particles) pt.draw();
    drawPlayer();
  }

  function loop(timestamp){
    if(!lastTime) lastTime = timestamp;
    let dt = timestamp - lastTime;
    lastTime = timestamp;
    dt = Math.min(dt, 40); // 防止切标签页后dt过大

    if(gameState === 'playing'){
      update(dt);
    }
    render();
    requestAnimationFrame(loop);
  }

  // ============ 状态切换 ============
  function showScreen(id){
    document.querySelectorAll('.overlay').forEach(el=>el.classList.add('hidden'));
    if(id) document.getElementById(id).classList.remove('hidden');
  }

  function startGame(){
    ensureAudio();
    score = 0; wave = 1; waveTimer = 0; enemySpawnTimer = 0;
    bossActive = false; boss = null; bossSpawnedForWave = 0;
    document.getElementById('boss-hp-wrap').style.display = 'none';
    bullets = []; enemyBullets = []; enemies = []; particles = []; powerUps = [];
    resetPlayer();
    initStars();
    gameState = 'playing';
    showScreen(null);
  }

  function togglePause(){
    if(gameState === 'playing'){
      gameState = 'paused';
      showScreen('screen-pause');
    } else if(gameState === 'paused'){
      gameState = 'playing';
      showScreen(null);
    }
  }

  function triggerGameOver(){
    gameState = 'over';
    if(score > highScore){
      highScore = score;
      localStorage.setItem('planeWarHighScore', String(highScore));
    }
    document.getElementById('final-score').textContent = score;
    document.getElementById('final-high').textContent = highScore;
    document.getElementById('high-val').textContent = highScore;
    playGameOver();
    showScreen('screen-over');
  }

  // ============ 按钮绑定 ============
  document.getElementById('btn-start').addEventListener('click', startGame);
  document.getElementById('btn-restart').addEventListener('click', startGame);
  document.getElementById('btn-restart-from-pause').addEventListener('click', startGame);
  document.getElementById('btn-resume').addEventListener('click', togglePause);
  document.getElementById('btn-pause').addEventListener('click', ()=>{
    if(gameState==='playing' || gameState==='paused') togglePause();
  });
  document.getElementById('btn-mute').addEventListener('click', (e)=>{
    muted = !muted;
    e.currentTarget.textContent = muted ? '🔇' : '🔊';
  });

  // ============ 启动 ============
  initStars();
  requestAnimationFrame(loop);

})();
</script>
</body>
